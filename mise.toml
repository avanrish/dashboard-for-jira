[tools]
# LINT.IfChange(go_version)
go = "1.27.3"
# LINT.ThenChange(//go.mod:go_version)
# LINT.IfChange(committed_version)
committed = "1.1.11"
# LINT.ThenChange(//.github/workflows/committed.yaml:committed_version)
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.9.0", depends = "go" }
"aqua:tailwindlabs/tailwindcss" = "4.3.4"

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

# LINT.IfChange(lint_task)
[tasks.lint]
description = "Run golangci-lint and all checks"
depends = ["check-fmt", "check-mod", "vulncheck"]
run = "golangci-lint run"
# LINT.ThenChange(
#     //AGENTS.md:commands,
#     //README.md:commands,
#     //.github/workflows/ci.yaml:golangci_lint,
# )

[tasks.check-fmt]
description = "Check Go code formatting"
run = "golangci-lint fmt --diff"

[tasks.check-mod]
description = "Check go.mod and go.sum are tidy and dependencies are untampered"
run = ["go mod tidy -diff", "go mod verify"]

[tasks.vulncheck]
description = "Report known vulnerabilities in code paths the project calls"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.generate]
description = "Generate Go code from templ files and build the Tailwind stylesheet"
run = [
  "go tool templ generate",
  "tailwindcss --input internal/web/tailwind.css --output internal/web/static/app.css --minify",
]

[tasks.dev]
description = "Run the server with live reload at http://127.0.0.1:7331"
depends = ["dev:templ", "dev:css"]

[tasks."dev:templ"]
description = "Regenerate templ code, rebuild and restart the server, and reload the browser on changes"
hide = true
# exec replaces the shell, so templ stops the server itself when it restarts it.
run = '''go tool templ generate --watch \
  --watch-pattern='(.+\.go$)|(.+\.templ$)|(.+_templ\.txt$)|(static/app\.css$)' \
  --cmd='go build -o bin/dashboard-for-jira . && exec bin/dashboard-for-jira start' \
  --proxy=http://127.0.0.1:8080'''

[tasks."dev:css"]
description = "Rebuild the Tailwind stylesheet on changes"
hide = true
# Minify like `generate` does, so a dev session leaves the committed file unchanged.
run = "tailwindcss --input internal/web/tailwind.css --output internal/web/static/app.css --minify --watch=always"

[tasks.doc]
description = "Browse the documentation locally in the pkg.go.dev style"
run = "go doc -http"

[tasks.check-commits]
description = "Check that commits since main follow Conventional Commits"
run = "committed main..HEAD"
